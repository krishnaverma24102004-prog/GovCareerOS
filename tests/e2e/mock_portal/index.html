<!DOCTYPE html>
<html>
<head>
    <title>Mock Government Portal</title>
</head>
<body>
    <h1>Government Vacancies</h1>
    <div id="jobs"></div>
    <button id="next">Load Page 2</button>

    <script>
        async function loadJobs(page = 1) {
            const response = await fetch(`/api/recruitments?page=${page}`);
            const data = await response.json();
            const container = document.getElementById("jobs");
            data.forEach(job => {
                const div = document.createElement("div");
                div.innerText = job.post_name;
                container.appendChild(div);
            });
        }

        document.getElementById("next").onclick = () => loadJobs(2);
        loadJobs(1);
    </script>
</body>
</html>
